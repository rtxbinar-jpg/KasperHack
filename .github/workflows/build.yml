name: Kasper Hack APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0
          pip install cython==0.29.36

      - name: Fix buildozer.spec
        run: |
          sed -i 's/^requirements =.*/requirements = python3,kivy==2.2.1/' buildozer.spec

          sed -i 's/^android.api =.*/android.api = 35/' buildozer.spec
          sed -i 's/^android.minapi =.*/android.minapi = 24/' buildozer.spec
          sed -i 's/^android.ndk =.*/android.ndk = 28c/' buildozer.spec
          sed -i 's/^android.archs =.*/android.archs = arm64-v8a/' buildozer.spec

          echo "===== BUILDОZER SPEC ====="
          cat buildozer.spec

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
          P4A_NO_BUILDOPTS: "1"
        run: |
          buildozer android clean || true
          buildozer -v android debug

      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kasper-Hack-APK
          path: bin/*.apk
          if-no-files-found: error
