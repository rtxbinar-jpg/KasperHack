name: Build Kasper Hack APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O android-cmdline-tools.zip

          unzip -q android-cmdline-tools.zip

          mv cmdline-tools \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          echo "SDK: $ANDROID_SDK_ROOT"

          echo ""
          echo "Build Tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools"

          echo ""
          echo "AIDL:"
          find "$ANDROID_SDK_ROOT/build-tools" \
            -type f \
            -name "aidl" \
            -print

          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl"

          echo ""
          echo "AIDL executable: OK"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.36

      - name: Configure buildozer.spec
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("buildozer.spec")
          text = path.read_text()

          sdk = os.environ["ANDROID_SDK_ROOT"]

          lines = text.splitlines()

          result = []
          sdk_found = False
          license_found = False

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("android.sdk_path"):
                  result.append(f"android.sdk_path = {sdk}")
                  sdk_found = True

              elif stripped.startswith("android.accept_sdk_license"):
                  result.append("android.accept_sdk_license = True")
                  license_found = True

              else:
                  result.append(line)

          if not sdk_found:
              result.append("")
              result.append(f"android.sdk_path = {sdk}")

          if not license_found:
              result.append("android.accept_sdk_license = True")

          path.write_text("\n".join(result) + "\n")
          PY

          echo "===== buildozer.spec Android settings ====="
          grep -E "android.sdk_path|android.accept_sdk_license" buildozer.spec || true

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          buildozer -v android debug

      - name: Find APK
        run: |
          echo "================================"
          echo "APK FILES"
          echo "================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kasper-Hack-APK
          path: bin/*.apk
          if-no-files-found: error
