name: Build Kasper Hack APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.36

      # ------------------------------------------------
      # Create the SDK where Buildozer expects it
      # ------------------------------------------------
      - name: Prepare Buildozer Android SDK
        run: |
          SDK="/home/runner/.buildozer/android/platform/android-sdk"

          rm -rf "$SDK"
          mkdir -p "$SDK/cmdline-tools"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O android-cmdline-tools.zip

          unzip -q android-cmdline-tools.zip

          mv cmdline-tools \
            "$SDK/cmdline-tools/latest"

          # Buildozer eski SDK path'ini kutadi:
          # android-sdk/tools/bin/sdkmanager
          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          chmod +x \
            "$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "SDK created:"
          ls -la "$SDK"

          echo ""
          echo "sdkmanager:"
          ls -la "$SDK/tools/bin/sdkmanager"

      # ------------------------------------------------
      # Accept licenses
      # ------------------------------------------------
      - name: Accept Android licenses
        run: |
          SDK="/home/runner/.buildozer/android/platform/android-sdk"

          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses < /dev/null || true

      # ------------------------------------------------
      # Install required Android packages
      # ------------------------------------------------
      - name: Install Android SDK packages
        run: |
          SDK="/home/runner/.buildozer/android/platform/android-sdk"

          yes | "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses || true

          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ------------------------------------------------
      # Verify sdkmanager
      # ------------------------------------------------
      - name: Verify SDK
        run: |
          SDK="/home/runner/.buildozer/android/platform/android-sdk"

          echo "SDK:"
          echo "$SDK"

          echo ""
          echo "sdkmanager:"
          test -x "$SDK/tools/bin/sdkmanager"
          echo "sdkmanager: OK"

          echo ""
          echo "Build Tools:"
          ls -la "$SDK/build-tools"

          echo ""
          echo "AIDL:"
          find "$SDK/build-tools" \
            -type f \
            -name aidl \
            -print

          echo ""
          echo "AIDL executable:"
          test -x "$SDK/build-tools/35.0.0/aidl"

          echo "AIDL: OK"

      # ------------------------------------------------
      # Check project
      # ------------------------------------------------
      - name: Check project
        run: |
          echo "Project files:"
          ls -la

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

          echo ""
          echo "buildozer.spec: OK"

      # ------------------------------------------------
      # Build APK
      # ------------------------------------------------
      - name: Build Kasper Hack APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          buildozer -v android debug

      # ------------------------------------------------
      # Find APK
      # ------------------------------------------------
      - name: Find APK
        run: |
          echo "======================================"
          echo "GENERATED APK"
          echo "======================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

      # ------------------------------------------------
      # Upload APK
      # ------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kasper-Hack-APK
          path: bin/*.apk
          if-no-files-found: error
