name: Kasper Hack APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0
          pip install cython==0.29.36

      # ------------------------------------------------
      # ANDROID SDK
      # ------------------------------------------------

      - name: Prepare Android SDK
        run: |

          SDK="/home/runner/.buildozer/android/platform/android-sdk"

          rm -rf "$SDK"

          mkdir -p "$SDK/cmdline-tools"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O cmdline.zip

          unzip -q cmdline.zip

          mv cmdline-tools "$SDK/cmdline-tools/latest"

          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          chmod +x \
            "$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "SDK prepared"

      - name: Accept Android licenses
        run: |

          SDK="/home/runner/.buildozer/android/platform/android-sdk"

          yes | "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses || true

      - name: Install exact Android SDK versions
        run: |

          SDK="/home/runner/.buildozer/android/platform/android-sdk"

          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Installed:"
          ls -la "$SDK/build-tools"
          ls -la "$SDK/platforms"

      # ------------------------------------------------
      # FORCE BUILDOZER TO USE OUR SDK
      # ------------------------------------------------

      - name: Configure buildozer.spec
        run: |

          python - <<'PY'
          from pathlib import Path

          p = Path("buildozer.spec")
          text = p.read_text()

          lines = text.splitlines()

          output = []

          for line in lines:
              if line.startswith("android.sdk_path"):
                  continue

              if line.startswith("android.skip_update"):
                  continue

              if line.startswith("android.accept_sdk_license"):
                  continue

              output.append(line)

          output.append("")
          output.append("android.sdk_path = /home/runner/.buildozer/android/platform/android-sdk")
          output.append("android.skip_update = True")
          output.append("android.accept_sdk_license = True")

          p.write_text("\n".join(output) + "\n")
          PY

          echo "===== BUILDOZER SPEC ====="
          cat buildozer.spec

      # ------------------------------------------------
      # VERIFY
      # ------------------------------------------------

      - name: Verify Android SDK
        run: |

          SDK="/home/runner/.buildozer/android/platform/android-sdk"

          echo "SDK = $SDK"

          echo ""
          echo "SDKMANAGER:"
          test -x "$SDK/tools/bin/sdkmanager"
          echo "OK"

          echo ""
          echo "BUILD TOOLS:"
          ls -la "$SDK/build-tools"

          echo ""
          echo "AIDL:"
          test -x "$SDK/build-tools/35.0.0/aidl"
          echo "AIDL 35.0.0 OK"

          echo ""
          echo "PLATFORM:"
          test -d "$SDK/platforms/android-35"
          echo "ANDROID 35 OK"

      # ------------------------------------------------
      # BUILD
      # ------------------------------------------------

      - name: Build Kasper Hack
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |

          buildozer android clean || true

          buildozer -v android debug

      # ------------------------------------------------
      # FIND APK
      # ------------------------------------------------

      - name: Find APK
        run: |

          echo "================================="
          echo "APK FILES"
          echo "================================="

          find . \
            -type f \
            -name "*.apk" \
            -print

      # ------------------------------------------------
      # UPLOAD
      # ------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kasper-Hack-APK
          path: bin/*.apk
          if-no-files-found: error
