name: Build Kasper Hack APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.36

      # Buildozer'ning aynan o'zi ishlatadigan SDK joyini yaratamiz
      - name: Prepare Buildozer Android SDK
        run: |
          SDK="/home/runner/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O android-tools.zip

          unzip -q android-tools.zip

          mv cmdline-tools "$SDK/cmdline-tools/latest"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "SDK prepared:"
          ls -la "$SDK"

      # License'larni oldindan qabul qilamiz
      - name: Accept Android licenses
        run: |
          SDK="/home/runner/.buildozer/android/platform/android-sdk"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses || true

      # Aynan Buildozer talab qilayotgan Build Tools 37
      - name: Install Android Build Tools 37
        run: |
          SDK="/home/runner/.buildozer/android/platform/android-sdk"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

      # AIDL mavjudligini tekshirish
      - name: Verify AIDL
        run: |
          SDK="/home/runner/.buildozer/android/platform/android-sdk"

          echo "Build Tools:"
          ls -la "$SDK/build-tools"

          echo ""
          echo "AIDL:"
          find "$SDK/build-tools" \
            -type f \
            -name aidl \
            -print

          AIDL="$SDK/build-tools/37.0.0/aidl"

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: AIDL not found!"
            exit 1
          fi

          chmod +x "$AIDL"

          echo "AIDL found successfully!"

      # Project tekshirish
      - name: Check project
        run: |
          ls -la

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

      # Buildozer'ni ishga tushirish
      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          buildozer -v android debug

      # APK topish
      - name: Find APK
        run: |
          echo "Generated APK:"
          find . -type f -name "*.apk" -print

      # APK'ni saqlash
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kasper-Hack-APK
          path: bin/*.apk
          if-no-files-found: error
