name: Build Kasper Hack APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      # Android SDK Command Line Tools
      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O cmdline-tools.zip

          unzip -q cmdline-tools.zip

          mv cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      # Android packages
      - name: Install Android packages
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # Check SDK
      - name: Verify Android SDK
        run: |
          echo "SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Build Tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools"

          echo ""
          echo "AIDL:"
          find "$ANDROID_SDK_ROOT/build-tools" \
            -type f \
            -name "aidl" \
            -print

          echo ""
          echo "AIDL version:"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl" --version

      # Python tools
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.36

      # Make sure Buildozer uses our SDK
      - name: Configure Buildozer
        run: |
          mkdir -p ~/.buildozer

          cat > ~/.buildozer/config.ini <<EOF
          [buildozer]
          android.sdk_path = $ANDROID_SDK_ROOT
          EOF

      # Check project
      - name: Check project
        run: |
          echo "Project:"
          ls -la

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

          echo "buildozer.spec found!"

      # Build
      - name: Build Kasper Hack APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          buildozer -v android debug

      # Find APK
      - name: Find APK
        run: |
          echo "=============================="
          echo "APK FILES"
          echo "=============================="

          find . -type f -name "*.apk" -print

      # Upload
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kasper-Hack-APK
          path: bin/*.apk
          if-no-files-found: error
